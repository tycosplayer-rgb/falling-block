<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-left">
          <h1 class="title">落井下石</h1>
          <span id="level-label" class="badge">关卡 1</span>
        </div>
        <div class="hud-right">
          <span id="moves-label" class="badge">步数 0</span>
          <button id="btn-restart" type="button" class="btn">重新开始</button>
        </div>
      </header>
      <main id="stage-wrap">
        <canvas id="game" width="800" height="600" aria-label="游戏画布"></canvas>
        <nav class="dpad" aria-label="方向键">
          <div class="dpad-inner">
            <button type="button" class="dpad-btn dpad-n" data-dir="N" aria-label="北"><span>▲</span></button>
            <button type="button" class="dpad-btn dpad-w" data-dir="W" aria-label="西"><span>◀</span></button>
            <button type="button" class="dpad-btn dpad-e" data-dir="E" aria-label="东"><span>▶</span></button>
            <button type="button" class="dpad-btn dpad-s" data-dir="S" aria-label="南"><span>▼</span></button>
          </div>
        </nav>
        <div id="overlay" class="overlay hidden" role="dialog" aria-live="polite">
          <div class="overlay-card">
            <p id="overlay-msg"></p>
            <button id="btn-overlay" type="button" class="btn primary">继续</button>
          </div>
        </div>
      </main>
      <footer class="hint">
        <span>蓝格仅可躺过 · 粉格躺着会弹回 · 直立落在目标上过关</span>
